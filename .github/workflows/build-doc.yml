name: Build Documentation

on:
  push:
    branches:
      - main # Trigger on pushes to the default branch
  workflow_dispatch:        # Allow manual triggering of the workflow from the GitHub Actions interface

# Cancel previous runs if a new commit is pushed to the same PR or branch
concurrency:
  group: ${{ github.ref }}  # Group runs by the ref (branch or PR)
  cancel-in-progress: true  # Cancel any ongoing runs in the same group

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write         # Push the provenance ledger back to the branch (see the step that does)
  pages: write            # Write access to GitHub Pages
  id-token: write         # Write access to ID tokens
  issues: write           # Write access to issues
  pull-requests: write    # Write access to pull requests
  actions: read           # Read the previous run's artifact, for the referee revision diff

jobs:
  build_project:
    runs-on: ubuntu-latest
    name: Build documentation
    steps:
      - name: Cleanup to free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false
          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout project
        uses: actions/checkout@v7 # v6.0.0
        with:
          fetch-depth: 1
          
      - name: Build project
        uses: leanprover/lean-action@a811f12834a45345026c26b89eea877e0ddad406 # 2026-01-15
        with:
          build: true
          lint: false
          mk_all-check: false
      
      - name: Lint project
        run: |
          lake exe runLinter KernelHom
      
      - name: Build Verso Documentation
        run: |
          ./build_manual.sh
      
      - name: Build docgen
        uses: leanprover-community/docgen-action@7b5b9a1822650bd45aaeb4182d94bceba2030f89 # 2026-04-14
        with:
          homepage: html
          blueprint: false
          build-page: false
          deploy: false
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with: 
          github_token: ${{ secrets.GITHUB_TOKEN }} 
          publish_dir: html