name = "KernelHom"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["KernelHom", "MeasureKernel"]
testDriver = "KernelHomTests"
lintDriver = "batteries/runLinter"

[leanOptions]
pp.unicode.fun = true                 # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "main"

[[require]]
name = "eqlift"
git = "https://github.com/gaetanserre/EqLift"
rev = "paper"

[[require]]
name = "mathlib"
scope = "leanprover-community"

[[lean_lib]]
name = "KernelHom"

[[lean_lib]]
name = "MeasureKernel"

[[lean_lib]]
name = "KernelHomTests"
globs = ["KernelHomTests.*"]

[[lean_lib]]
name = "KernelHomManual"
globs = ["KernelHomManual.+"]

# Options common to the files of the manual, whose `#doc` blocks are prose and not Mathlib code.
[lean_lib.leanOptions]
pp.rawOnError = true
weak.verso.code.warnLineLength = 100
weak.linter.style.header = false
weak.linter.style.setOption = false
weak.linter.style.longLine = false
weak.linter.style.emptyLine = false
weak.linter.hashCommand = false

[[lean_exe]]
name = "manual"
srcDir = "KernelHomManual/"
root = "Manual"
